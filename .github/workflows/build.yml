name: Build plugins

on:
  push:
  workflow_dispatch:
    inputs:
      artifacts_run:
        description: 'Only run the DAW tests, on the plugins built by this run id'
        required: false
        default: ''

env:
  IPLUG2_COMMIT: d82b2e99b17c8f723d3f6e2a88ffd8b656f28e5d
  VST3_TAG: v3.8.0_build_66
  PATCH: patch/MS20_monopoly_v50c.axp

jobs:
  # ---------------- Mac: AU + VST3, universal (Apple Silicon + Intel) ----------------
  build-mac:
    if: ${{ !inputs.artifacts_run }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Get iPlug2 and the VST3 SDK (fixed versions)
        run: |
          git clone -q https://github.com/iPlug2/iPlug2.git iPlug2
          cd iPlug2 && git checkout -q $IPLUG2_COMMIT && git apply ../tools/iplug2-recording.patch
          cd Dependencies/IPlug && rm -rf VST3_SDK
          git clone -q https://github.com/steinbergmedia/vst3sdk.git --branch $VST3_TAG --depth=1 VST3_SDK
          cd VST3_SDK && git submodule update -q --init pluginterfaces base public.sdk cmake

      - name: AAX SDK (optional, from private secrets)
        shell: bash
        env:
          AAX_SDK_B64_1: ${{ secrets.AAX_SDK_B64_1 }}
          AAX_SDK_B64_2: ${{ secrets.AAX_SDK_B64_2 }}
          AAX_SDK_B64_3: ${{ secrets.AAX_SDK_B64_3 }}
          AAX_SDK_B64_4: ${{ secrets.AAX_SDK_B64_4 }}
          AAX_SDK_B64_5: ${{ secrets.AAX_SDK_B64_5 }}
          AAX_SDK_B64_6: ${{ secrets.AAX_SDK_B64_6 }}
          AAX_SDK_B64_7: ${{ secrets.AAX_SDK_B64_7 }}
        run: |
          if [ -n "$AAX_SDK_B64_1" ]; then
            echo "${AAX_SDK_B64_1}${AAX_SDK_B64_2}${AAX_SDK_B64_3}${AAX_SDK_B64_4}${AAX_SDK_B64_5}${AAX_SDK_B64_6}${AAX_SDK_B64_7}" | base64 -d | tar -xJ -C iPlug2/Dependencies/IPlug/
            ls iPlug2/Dependencies/IPlug/AAX_SDK/CMakeLists.txt && echo "HAVE_AAX=1" >> $GITHUB_ENV
          else
            echo "No AAX SDK secret: AAX is skipped."
          fi

      - name: Generate the engine from the Ksoloti patch
        run: python3 engine/gen_engine.py $PATCH engine/engine_gen.h

      - name: Engine tests (host layer, resampler, patch memory)
        run: |
          cd tests
          clang++ -std=c++17 -O2 -w -o host_test host_test.cpp && ./host_test
          clang++ -std=c++17 -O2 -w -o rs_test rs_test.cpp && ./rs_test
          clang++ -std=c++17 -O2 -w -o recall_test recall_test.cpp && ./recall_test
          clang++ -std=c++17 -O2 -w -o automation_test automation_test.cpp && ./automation_test
          clang++ -std=c++17 -O2 -w -o panel_test panel_test.cpp && ./panel_test
          clang++ -std=c++17 -O2 -w -o mem_test mem_test.cpp && ./mem_test

      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 -DIPLUG_DEPLOY_PLUGINS=OFF

      - name: Build AU + VST3
        run: |
          set +e
          cmake --build build --config Release --target TwentyEngine-au --target TwentyEngine-vst3 -- -quiet > build.log 2>&1
          st=$?
          grep -E "error:|error G|fatal" build.log | sort -u | head -25 | sed 's/^/::error::/'
          grep -E -A6 "Undefined symbols|duplicate symbol" build.log | head -30 | sed 's/^/::error::/'
          exit $st

      - name: Build Twenty Engine Automation (AU + VST3, the same source as its own plugin)
        run: |
          python3 tools/make_variant.py studio
          cmake -S studio -B build-studio -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 -DIPLUG_DEPLOY_PLUGINS=OFF -DIPLUG2_DIR="$PWD/iPlug2" > studio-cfg.log 2>&1 || { tail -40 studio-cfg.log; exit 1; }
          set +e
          cmake --build build-studio --config Release --target TwentyEngineAutomation-au --target TwentyEngineAutomation-vst3 -- -quiet > studio.log 2>&1
          st=$?
          grep -E "error:|error G|fatal" studio.log | sort -u | head -25 | sed 's/^/::error::/'
          grep -E -A6 "Undefined symbols|duplicate symbol" studio.log | head -30 | sed 's/^/::error::/'
          exit $st

      - name: Sign (ad hoc) and validate the AU (Intel)
        run: |
          COMP=$(find build -name "TwentyEngine.component" -type d | head -1)
          VST3=$(find build -name "TwentyEngine.vst3" -type d | head -1)
          echo "AU: $COMP  VST3: $VST3"
          codesign --force --deep -s - "$COMP"
          codesign --force --deep -s - "$VST3"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$COMP" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -v aumu Tw20 Pkmo
          mkdir -p out && cp -R "$COMP" "$VST3" out/
          # the oldest macOS each binary runs on (must be 10.13 for Catalina / High Sierra users)
          for B in "$COMP/Contents/MacOS/"* "$VST3/Contents/MacOS/"*; do
            for A in x86_64 arm64; do echo "$(basename "$B") $A: $(vtool -arch $A -show-build "$B" 2>/dev/null | awk '/^ *(minos|version) /{print $2; exit}')"; done
          done
          # below 10.14 the minimum sits in LC_VERSION_MIN_MACOSX ("version"), from 10.14 in LC_BUILD_VERSION ("minos")
          MINOS=$(vtool -arch x86_64 -show-build "$COMP/Contents/MacOS/"* | awk '/^ *(minos|version) /{print $2; exit}')
          [ "$MINOS" = "10.13" ] || { echo "::error::Intel AU minimum macOS is $MINOS, expected 10.13"; exit 1; }
          # Twenty Engine Automation, validated next to the instrument (both installed at once)
          SCOMP=$(find build-studio -name "TwentyEngineAutomation.component" -type d | head -1)
          SVST3=$(find build-studio -name "TwentyEngineAutomation.vst3" -type d | head -1)
          echo "Automation AU: $SCOMP  VST3: $SVST3"
          codesign --force --deep -s - "$SCOMP"
          codesign --force --deep -s - "$SVST3"
          cp -R "$SCOMP" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -v aumu Tw2S Pkmo
          auval -v aumu Tw20 Pkmo > /dev/null && echo "both AUs validate side by side"
          cp -R "$SCOMP" "$SVST3" out/

      - name: Package
        run: |
          cd out
          ditto -c -k --keepParent TwentyEngine.component ../TwentyEngine-AU.zip && ditto -c -k --keepParent TwentyEngine.vst3 ../TwentyEngine-VST3-Mac.zip
          ditto -c -k --keepParent TwentyEngineAutomation.component ../TwentyEngineAutomation-AU.zip && ditto -c -k --keepParent TwentyEngineAutomation.vst3 ../TwentyEngineAutomation-VST3-Mac.zip

      - name: Build AAX (unsigned, only with the AAX SDK)
        if: env.HAVE_AAX == '1'
        run: |
          cmake --build build --config Release --target TwentyEngine-aax -- -quiet > aax.log 2>&1 || (grep -E "error:" aax.log | head -20 | sed 's/^/::error::/'; exit 1)
          AAX=$(find build -name "*.aaxplugin" -type d | head -1); echo "AAX: $AAX"
          ditto -c -k --keepParent "$AAX" TwentyEngine-AAX-Mac-unsigned.zip

      - name: Build the installer (.pkg)
        run: |
          VER=$(grep -E '#define PLUG_VERSION_STR' config.h | sed -E 's/.*"(.*)".*/\1/')
          mkdir -p pkgroot/au pkgroot/vst3
          cp -R out/TwentyEngine.component out/TwentyEngineAutomation.component pkgroot/au/
          cp -R out/TwentyEngine.vst3 out/TwentyEngineAutomation.vst3 pkgroot/vst3/
          pkgbuild --root pkgroot/au --identifier com.peterkohlmetzmoller.twentyengine.au --version "$VER" \
            --install-location /Library/Audio/Plug-Ins/Components --scripts installer/scripts au.pkg
          pkgbuild --root pkgroot/vst3 --identifier com.peterkohlmetzmoller.twentyengine.vst3 --version "$VER" \
            --install-location /Library/Audio/Plug-Ins/VST3 vst3.pkg
          productbuild --distribution installer/distribution.xml --resources installer/resources --package-path . TwentyEngine-Installer.pkg
          ls -la TwentyEngine-Installer.pkg

      - name: Test the installer (install, then validate the installed AU)
        run: |
          rm -rf ~/Library/Audio/Plug-Ins/Components/TwentyEngine.component ~/Library/Audio/Plug-Ins/Components/TwentyEngineAutomation.component
          sudo installer -pkg TwentyEngine-Installer.pkg -target /
          ls -d /Library/Audio/Plug-Ins/Components/TwentyEngine.component /Library/Audio/Plug-Ins/VST3/TwentyEngine.vst3
          ls -d /Library/Audio/Plug-Ins/Components/TwentyEngineAutomation.component /Library/Audio/Plug-Ins/VST3/TwentyEngineAutomation.vst3
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -v aumu Tw20 Pkmo
          auval -v aumu Tw2S Pkmo

      - uses: actions/upload-artifact@v4
        with:
          name: TwentyEngine-Mac
          path: |
            TwentyEngine-Installer.pkg
            TwentyEngine-AU.zip
            TwentyEngine-VST3-Mac.zip
            TwentyEngineAutomation-AU.zip
            TwentyEngineAutomation-VST3-Mac.zip
            TwentyEngine-AAX-Mac-unsigned.zip

  # ---------------- Apple Silicon: validate the arm64 half of the same AU ----------------
  # Apple Silicon runners are rarely available on GitHub (jobs sat in the queue and were cancelled), so the
  # DAW test below runs on Intel; the universal binaries are the same.

  # ---------------- the plugins in other hosts: pluginval and REAPER (Mac) ----------------
  daw-test-mac:
    needs: build-mac
    if: ${{ !cancelled() && (needs.build-mac.result == 'success' || inputs.artifacts_run) }}
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TwentyEngine-Mac
          path: art
          run-id: ${{ inputs.artifacts_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install both plugins (AU + VST3)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components ~/Library/Audio/Plug-Ins/VST3
          for z in TwentyEngine-AU TwentyEngineAutomation-AU; do ditto -x -k art/$z.zip ~/Library/Audio/Plug-Ins/Components/; done
          for z in TwentyEngine-VST3-Mac TwentyEngineAutomation-VST3-Mac; do ditto -x -k art/$z.zip ~/Library/Audio/Plug-Ins/VST3/; done
          killall -9 AudioComponentRegistrar || true
          ls ~/Library/Audio/Plug-Ins/Components ~/Library/Audio/Plug-Ins/VST3
      - name: pluginval (plugin stress test)
        id: pv
        continue-on-error: true
        run: |
          curl -sL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          ditto -x -k pv.zip pv
          PV=$(find pv -path "*MacOS/pluginval" -type f | head -1)
          st=0
          for p in VST3/TwentyEngine.vst3 VST3/TwentyEngineAutomation.vst3 Components/TwentyEngine.component Components/TwentyEngineAutomation.component; do
            P="$HOME/Library/Audio/Plug-Ins/$p"
            "$PV" --strictness-level 5 --skip-gui-tests --timeout-ms 900000 --validate "$P" > pv.log 2>&1; r=$?
            echo "::group::pluginval $p (exit $r)"; cat pv.log | tail -120; echo "::endgroup::"
            if [ $r -eq 0 ]; then echo "PLUGINVAL PASS $p"; else echo "::error::pluginval failed: $p"; grep -E "FAILED|!!!|\*\*\*" pv.log | head -20; st=1; fi
          done
          exit $st
      - name: REAPER (render with both plugins)
        id: reaper
        continue-on-error: true
        run: |
          F=$(curl -sL https://www.reaper.fm/download.php | grep -oE 'files/[0-9]+\.x/reaper[0-9]+_universal\.dmg' | head -1)
          echo "REAPER download: $F"
          curl -sL -o reaper.dmg "https://www.reaper.fm/$F"
          ls -la reaper.dmg
          yes | PAGER=cat hdiutil attach -nobrowse -mountpoint /Volumes/R reaper.dmg > /dev/null   # the image shows a licence: accept it
          ls /Volumes/R
          APP=$(find /Volumes/R -maxdepth 2 -name "REAPER*.app" | head -1); echo "app: $APP"
          cp -R "$APP" /Applications/REAPER.app
          RES="$HOME/Library/Application Support/REAPER"
          mkdir -p "$RES/Scripts" daw
          cp tests/daw/reaper_test.lua "$RES/Scripts/__startup.lua"
          export TE_OUT="$PWD/daw"
          /Applications/REAPER.app/Contents/MacOS/REAPER -nosplash -new > daw/stdout.txt 2>&1 &
          RP=$!
          # a fresh REAPER asks about the audio device first: answer "No" until the test script has started
          ( set +e; for i in $(seq 1 40); do sleep 3; [ -f daw/reaper_log.txt ] && break; osascript -e 'tell application "System Events" to tell process "SecurityAgent" to click button "Cancel" of window 1' >> daw/dialogs.txt 2>&1 || true; osascript -e 'tell application "System Events" to tell process "REAPER" to click button "No" of window 1' >> daw/dialogs.txt 2>&1 || true; done ) &
          for i in $(seq 1 150); do grep -q DONE daw/reaper_log.txt 2>/dev/null && break; sleep 4; done
          screencapture -x shot.png 2>/dev/null && sips -Z 900 shot.png > /dev/null 2>&1 && { echo "SCREENSHOT-BEGIN"; base64 -i shot.png | tr -d '\n'; echo; echo "SCREENSHOT-END"; }
          echo "---- diagnostics"; sort daw/dialogs.txt 2>/dev/null | uniq -c | head; cat daw/stdout.txt | tail -20; ls -la "$RES" "$RES/Scripts"
          osascript -e 'tell application "System Events" to get name of every window of process "REAPER"' 2>&1 | head -3
          osascript -e 'tell application "System Events" to get entire contents of window 1 of process "REAPER"' 2>&1 | head -c 1500; echo
          screencapture -x shot2.png 2>&1 | head -3; ls -la shot*.png 2>/dev/null
          [ -f "$RES/reaper.ini" ] && { echo "---- reaper.ini"; head -60 "$RES/reaper.ini"; }
          ps aux | grep -i -E "reaper|TCC|UserNotification" | grep -v grep | cut -c1-200 | head
          kill -9 $RP 2>/dev/null || true
          echo "---- REAPER log"; cat daw/reaper_log.txt 2>/dev/null || echo "(no log: the script did not run)"
          echo "---- renders"; python3 tests/daw/analyze.py daw
      - name: Result
        if: always()
        run: |
          echo "pluginval: ${{ steps.pv.outcome }}   REAPER: ${{ steps.reaper.outcome }}"
          [ "${{ steps.pv.outcome }}" = success ] && [ "${{ steps.reaper.outcome }}" = success ]

  # ---------------- Windows: VST3 (64-bit), checked with Steinberg's validator ----------------
  build-windows:
    if: ${{ !inputs.artifacts_run }}
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Get iPlug2 and the VST3 SDK (fixed versions)
        run: |
          git clone -q https://github.com/iPlug2/iPlug2.git iPlug2
          cd iPlug2 && git checkout -q $IPLUG2_COMMIT && git apply ../tools/iplug2-recording.patch
          cd Dependencies/IPlug && rm -rf VST3_SDK
          git clone -q https://github.com/steinbergmedia/vst3sdk.git --branch $VST3_TAG --depth=1 VST3_SDK
          cd VST3_SDK && git submodule update -q --init pluginterfaces base public.sdk cmake vstgui4

      - name: AAX SDK (optional, from private secrets)
        shell: bash
        env:
          AAX_SDK_B64_1: ${{ secrets.AAX_SDK_B64_1 }}
          AAX_SDK_B64_2: ${{ secrets.AAX_SDK_B64_2 }}
          AAX_SDK_B64_3: ${{ secrets.AAX_SDK_B64_3 }}
          AAX_SDK_B64_4: ${{ secrets.AAX_SDK_B64_4 }}
          AAX_SDK_B64_5: ${{ secrets.AAX_SDK_B64_5 }}
          AAX_SDK_B64_6: ${{ secrets.AAX_SDK_B64_6 }}
          AAX_SDK_B64_7: ${{ secrets.AAX_SDK_B64_7 }}
        run: |
          if [ -n "$AAX_SDK_B64_1" ]; then
            echo "${AAX_SDK_B64_1}${AAX_SDK_B64_2}${AAX_SDK_B64_3}${AAX_SDK_B64_4}${AAX_SDK_B64_5}${AAX_SDK_B64_6}${AAX_SDK_B64_7}" | base64 -d | tar -xJ -C iPlug2/Dependencies/IPlug/
            ls iPlug2/Dependencies/IPlug/AAX_SDK/CMakeLists.txt && echo "HAVE_AAX=1" >> $GITHUB_ENV
          else
            echo "No AAX SDK secret: AAX is skipped."
          fi

      - name: Generate the engine from the Ksoloti patch
        run: python engine/gen_engine.py $PATCH engine/engine_gen.h

      - name: Configure (Visual Studio + clang-cl)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T ClangCL -DIPLUG_DEPLOY_PLUGINS=OFF

      - name: Build VST3
        run: |
          set +e
          cmake --build build --config Release --target TwentyEngine-vst3 > build.log 2>&1
          st=$?
          grep -E "error|fatal" build.log | grep -v " 0 error" | sort -u | head -25 | sed 's/^/::error::/'
          exit $st

      - name: Build Twenty Engine Automation (VST3, the same source as its own plugin)
        run: |
          python tools/make_variant.py studio
          cmake -S studio -B build-studio -G "Visual Studio 17 2022" -A x64 -T ClangCL -DIPLUG_DEPLOY_PLUGINS=OFF -DIPLUG2_DIR="$(cygpath -m "$PWD/iPlug2")" > studio-cfg.log 2>&1 || { tail -40 studio-cfg.log; exit 1; }
          set +e
          cmake --build build-studio --config Release --target TwentyEngineAutomation-vst3 > studio.log 2>&1
          st=$?
          grep -E "error|fatal" studio.log | grep -v " 0 error" | sort -u | head -25 | sed 's/^/::error::/'
          exit $st

      - name: Build Steinberg's VST3 validator
        run: |
          cd iPlug2/Dependencies/IPlug/VST3_SDK
          cmake -S . -B vbuild -G "Visual Studio 17 2022" -A x64 -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF > /dev/null
          cmake --build vbuild --config Release --target validator > vlog.txt 2>&1 || (grep -E "error" vlog.txt | head -20 | sed 's/^/::error::/'; exit 1)

      - name: Validate
        run: |
          VST3=$(find build -name "TwentyEngine.vst3" -type d | head -1)
          VAL=$(find iPlug2/Dependencies/IPlug/VST3_SDK/vbuild -name "validator.exe" | head -1)
          echo "VST3: $VST3  validator: $VAL"
          "$VAL" "$VST3" > val.txt 2>&1; st=$?
          tail -25 val.txt; grep -iE "failed|error" val.txt | head -10 | sed 's/^/::warning::/'
          mkdir -p out && cp -R "$VST3" out/
          [ $st -eq 0 ] || exit $st
          SVST3=$(find build-studio -name "TwentyEngineAutomation.vst3" -type d | head -1)
          echo "Automation VST3: $SVST3"
          "$VAL" "$SVST3" > sval.txt 2>&1; st=$?
          tail -5 sval.txt
          cp -R "$SVST3" out/
          exit $st

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path out/TwentyEngine.vst3 -DestinationPath TwentyEngine-VST3-Windows.zip
          Compress-Archive -Path out/TwentyEngineAutomation.vst3 -DestinationPath TwentyEngineAutomation-VST3-Windows.zip

      - name: Build AAX (unsigned, only with the AAX SDK)
        if: env.HAVE_AAX == '1'
        run: |
          cmake --build build --config Release --target TwentyEngine-aax > aax.log 2>&1 || (grep -E "error" aax.log | grep -v " 0 error" | head -20 | sed 's/^/::error::/'; exit 1)
          AAX=$(find build -name "*.aaxplugin" -type d | head -1); echo "AAX: $AAX"
          powershell -Command "Compress-Archive -Path '$AAX' -DestinationPath TwentyEngine-AAX-Windows-unsigned.zip"

      - name: Build the installer (.exe)
        run: |
          export TE_VERSION=$(grep -E '#define PLUG_VERSION_STR' config.h | sed -E 's/.*"(.*)".*/\1/')
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress > /dev/null; fi
          cd installer && "$ISCC" //Q windows.iss && cd .. && ls -la TwentyEngine-Setup.exe

      - name: Test the installer (silent install, validate, uninstall)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\Program Files\Common Files\VST3\TwentyEngine.vst3" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Common Files\VST3\TwentyEngineAutomation.vst3" -ErrorAction SilentlyContinue
          Start-Process -Wait -FilePath .\TwentyEngine-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          $inst = "C:\Program Files\Common Files\VST3\TwentyEngine.vst3"
          if (!(Test-Path $inst)) { throw "not installed" }
          $sinst = "C:\Program Files\Common Files\VST3\TwentyEngineAutomation.vst3"
          if (!(Test-Path $sinst)) { throw "Automation not installed" }
          $val = Get-ChildItem -Recurse -Filter validator.exe iPlug2\Dependencies\IPlug\VST3_SDK\vbuild | Select-Object -First 1
          & $val.FullName $inst | Select-Object -Last 3
          if ($LASTEXITCODE -ne 0) { throw "validator failed on the installed plugin" }
          $un = Get-ChildItem "$inst\..\" -Filter "unins*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$un) { $un = Get-ChildItem "$inst" -Filter "unins*.exe" | Select-Object -First 1 }
          Start-Process -Wait -FilePath $un.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          Start-Sleep -Seconds 3
          if ((Test-Path $inst) -or (Test-Path $sinst)) { throw "uninstall left files" } else { "installed, validated and uninstalled cleanly" }

      - uses: actions/upload-artifact@v4
        with:
          name: TwentyEngine-Windows
          path: |
            TwentyEngine-Setup.exe
            TwentyEngine-VST3-Windows.zip
            TwentyEngineAutomation-VST3-Windows.zip
            TwentyEngine-AAX-Windows-unsigned.zip

  # ---------------- the plugins in other hosts: pluginval and REAPER (Windows) ----------------
  daw-test-windows:
    needs: build-windows
    if: ${{ !cancelled() && (needs.build-windows.result == 'success' || inputs.artifacts_run) }}
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TwentyEngine-Windows
          path: art
          run-id: ${{ inputs.artifacts_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install both plugins (VST3)
        run: |
          D="/c/Program Files/Common Files/VST3"; mkdir -p "$D"
          7z x -y art/TwentyEngine-VST3-Windows.zip -o"$D" > /dev/null
          7z x -y art/TwentyEngineAutomation-VST3-Windows.zip -o"$D" > /dev/null
          ls "$D"
      - name: pluginval (plugin stress test)
        id: pv
        continue-on-error: true
        run: |
          curl -sL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          7z x -y pv.zip -opv > /dev/null
          PV=$(find pv -iname pluginval.exe | head -1)
          st=0
          for p in TwentyEngine.vst3 TwentyEngineAutomation.vst3; do
            "$PV" --strictness-level 5 --skip-gui-tests --timeout-ms 900000 --validate "C:\\Program Files\\Common Files\\VST3\\$p" > pv.log 2>&1; r=$?
            echo "::group::pluginval $p (exit $r)"; tail -120 pv.log; echo "::endgroup::"
            if [ $r -eq 0 ]; then echo "PLUGINVAL PASS $p"; else echo "::error::pluginval failed: $p"; grep -E "FAILED|!!!|\*\*\*" pv.log | head -20; st=1; fi
          done
          exit $st
      - name: REAPER (render with both plugins)
        id: reaper
        continue-on-error: true
        run: |
          F=$(curl -sL https://www.reaper.fm/download.php | grep -oE 'files/[0-9]+\.x/reaper[0-9]+_x64-install\.exe' | head -1)
          echo "REAPER download: $F"
          curl -sL -o reaper-install.exe "https://www.reaper.fm/$F"
          powershell -Command "Start-Process -Wait -FilePath .\\reaper-install.exe -ArgumentList '/S','/D=C:\\REAPER'"
          ls /c/REAPER | head
          RES="$APPDATA/REAPER"; mkdir -p "$RES/Scripts" daw
          cp tests/daw/reaper_test.lua "$RES/Scripts/__startup.lua"
          export TE_OUT="$(cygpath -w "$PWD/daw")"
          /c/REAPER/reaper.exe -nosplash -new > daw/stdout.txt 2>&1 &
          # a fresh REAPER asks "You have not yet selected an audio device": answer "No" until the test script has started
          ( for i in $(seq 1 40); do sleep 3; [ -f daw/reaper_log.txt ] && break; powershell -Command "\$w=New-Object -ComObject wscript.shell; if (\$w.AppActivate('REAPER')) { \$w.SendKeys('n') }" > /dev/null 2>&1; done ) &
          for i in $(seq 1 150); do grep -q DONE daw/reaper_log.txt 2>/dev/null && break; sleep 4; done
          powershell -Command "Add-Type -AssemblyName System.Windows.Forms,System.Drawing; \$b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds; \$m=New-Object System.Drawing.Bitmap \$b.Width,\$b.Height; \$g=[System.Drawing.Graphics]::FromImage(\$m); \$g.CopyFromScreen(\$b.Location,[System.Drawing.Point]::Empty,\$b.Size); \$s=New-Object System.Drawing.Bitmap \$m,([int](\$b.Width/2)),([int](\$b.Height/2)); \$s.Save('shot.png')" && { echo "SCREENSHOT-BEGIN"; base64 -w0 shot.png; echo; echo "SCREENSHOT-END"; }
          taskkill //F //IM reaper.exe > /dev/null 2>&1 || true
          echo "---- reaper.ini (Windows)"; grep -v -i -E "^(lastproject|recent)" "$RES/reaper.ini" | head -80
          echo "---- REAPER log"; cat daw/reaper_log.txt 2>/dev/null || echo "(no log: the script did not run)"
          echo "---- renders"; python tests/daw/analyze.py daw
      - name: Result
        if: always()
        run: |
          echo "pluginval: ${{ steps.pv.outcome }}   REAPER: ${{ steps.reaper.outcome }}"
          [ "${{ steps.pv.outcome }}" = success ] && [ "${{ steps.reaper.outcome }}" = success ]

  # ---------------- Teensy 4.1 firmware (.hex for the Teensy Loader) ----------------
  build-teensy:
    if: ${{ !inputs.artifacts_run }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Teensy toolchain (Teensyduino)
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://www.pjrc.com/teensy/package_teensy_index.json
          arduino-cli core update-index
          arduino-cli core install teensy:avr
          arduino-cli core list
      - name: 16-sample audio blocks (as the tested firmware)
        run: |
          H=$(find ~/.arduino15/packages/teensy -name AudioStream.h -path "*teensy4*" | head -1)
          echo "$H"; grep -n "define AUDIO_BLOCK_SAMPLES" "$H"
          sed -i -E 's/#define AUDIO_BLOCK_SAMPLES[[:space:]]+128/#define AUDIO_BLOCK_SAMPLES  16/' "$H"
          grep -n "define AUDIO_BLOCK_SAMPLES" "$H" | grep -q " 16" || { echo "::error::could not set 16-sample blocks"; exit 1; }
      - name: Check the engine copy
        run: cmp engine/engine_gen.h teensy/TwentyEngineTeensy/engine_gen.h && cmp engine/ksoloti_host.h teensy/TwentyEngineTeensy/ksoloti_host.h && echo "Teensy engine = plugin engine"
      - name: Build
        run: |
          arduino-cli compile --fqbn teensy:avr:teensy41:usb=serialmidi,speed=600 --output-dir out teensy/TwentyEngineTeensy 2>&1 | tail -25
          ls -la out/
          H=$(ls out/*.hex | head -1); sha256sum "$H"
          echo "HEX-BEGIN"; cat "$H"; echo "HEX-END"
      - uses: actions/upload-artifact@v4
        with:
          name: TwentyEngine-Teensy
          path: out/*.hex
